name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dry-run-and-mock:
    name: Suite 1 + 2 (dry-run + mock, no hardware)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y expect curl nmap

      - name: Run CI test suite
        run: ./tests/run-ci.sh

  lint:
    name: Suite 3 (shellcheck + helm lint, no hardware)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      - name: Install helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: shellcheck — Phase A helper
        run: shellcheck --severity=warning scripts/bootstrap-host-helper.sh

      - name: shellcheck — Phase B scripts
        run: |
          shellcheck --severity=warning \
            scripts/bootstrap-phase-b.sh \
            scripts/setup-static-ips.sh \
            scripts/setup-ssh-keys.sh \
            scripts/install-k3s.sh \
            scripts/gen-registry-certs.sh \
            scripts/install-ca.sh \
            scripts/setup-registry.sh \
            scripts/mount-ssd.sh \
            scripts/install-ollama.sh \
            scripts/install-tailscale.sh \
            scripts/setup-subnet-router.sh \
            scripts/setup-tailscale-operator.sh \
            scripts/install-monitoring.sh \
            scripts/apply-resource-policy.sh

      - name: shellcheck — test runners
        run: shellcheck --severity=warning tests/run-ci.sh tests/run-hardware.sh tests/check-cluster.sh

      - name: helm lint — registry chart
        run: helm lint charts/registry/

      - name: helm template — registry chart (verify render)
        run: helm template test-release charts/registry/ > /dev/null

      - name: helm lint — ollama chart
        run: helm lint charts/ollama/ --set nodeName=rk1-node1

      - name: helm template — ollama chart (verify render)
        run: helm template ollama-node1 charts/ollama/ --set nodeName=rk1-node1 > /dev/null

      - name: helm repo — prometheus-community (for monitoring values)
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update prometheus-community

      - name: helm template — monitoring values (verify render against upstream chart)
        run: helm template test-release prometheus-community/kube-prometheus-stack -f charts/monitoring/values.yaml > /dev/null

      - name: Install kubeconform (offline manifest validation)
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: kubeconform — manifests/
        run: kubeconform -strict -summary manifests/
