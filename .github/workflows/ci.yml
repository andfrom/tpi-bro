name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dry-run-and-mock:
    name: Suite 1 + 2 (dry-run + mock, no hardware)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y expect curl nmap

      - name: Run CI test suite
        run: ./tests/run-ci.sh
