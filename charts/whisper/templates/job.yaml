{{- if not .Values.audio.claimName }}
{{- fail "audio.claimName is required — an existing PVC containing the input audio." }}
{{- end }}
{{- if not .Values.audio.filePath }}
{{- fail "audio.filePath is required — path to the audio file within audio.claimName." }}
{{- end }}
{{- if and .Values.rknn.enabled (eq .Values.language "auto") }}
{{- fail "language: auto is not supported with rknn.enabled — the RKNN decoder is a fixed-shape greedy loop that needs the language token fixed before decoding starts (see images/whisper-stt/rknn/infer_rknn.py); there is no auto-detection pass like the CPU/faster-whisper path has. Set language to an explicit code (e.g. \"en\")." }}
{{- end }}
{{- if and .Values.rknn.enabled (not (has .Values.rknn.decoder (list "naive" "sa-kv"))) }}
{{- fail "rknn.decoder must be \"naive\" or \"sa-kv\"." }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      priorityClassName: {{ .Values.priorityClassName | quote }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: storage.tpi-bro/nvme
                    operator: In
                    values: ["true"]
                {{- if .Values.rknn.enabled }}
                  - key: tpi-bro/npu
                    operator: In
                    values: ["rk3588"]
                {{- end }}
      containers:
        - name: whisper
          image: "{{ .Values.image.repository }}:{{ if .Values.rknn.enabled }}rknn{{ else }}{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if and .Values.rknn.enabled (eq .Values.rknn.decoder "sa-kv") }}
          # SA-KV decoder (W-03): ~2.5x faster than the naive full-recompute
          # decoder. The image ENTRYPOINT stays the naive driver; this
          # override selects the SA-KV one. Requires the shim-exported
          # decoder model in the model cache (see RKNN-SA-KV-DECODER-BUG.md).
          command: ["python", "/app/infer_rknn_sa_kv.py"]
          {{- end }}
          # All variants take the audio path as a --audio CLI arg (see
          # Dockerfile.rknn and images/whisper-stt/app/whisper_stt.py).
          args:
            - --audio
            - "{{ .Values.audio.mountPath }}/{{ .Values.audio.filePath }}"
          {{- if .Values.rknn.enabled }}
          securityContext:
            privileged: {{ .Values.rknn.privileged }}
          {{- end }}
          env:
            - name: WHISPER_MODEL
              value: {{ .Values.model | quote }}
            - name: WHISPER_CACHE
              value: {{ .Values.modelCache.mountPath | quote }}
            - name: WHISPER_LANGUAGE
              value: {{ .Values.language | quote }}
            - name: WHISPER_BEAM_SIZE
              value: {{ .Values.beamSize | quote }}
            {{- if .Values.rknn.enabled }}
            # Dockerfile.rknn defaults these to the `medium` filenames; override
            # to match whichever model this release requests.
            - name: WHISPER_ENCODER
              value: "{{ .Values.modelCache.mountPath }}/whisper_encoder_{{ .Values.model }}.rknn"
            {{- if eq .Values.rknn.decoder "sa-kv" }}
            - name: WHISPER_XA_KV_ENCODER
              value: "{{ .Values.modelCache.mountPath }}/whisper_xa_kv_encoder_{{ .Values.model }}.rknn"
            - name: WHISPER_DECODER_SA_KV
              value: "{{ .Values.modelCache.mountPath }}/whisper_decoder_sa_kv_step_{{ .Values.model }}.rknn"
            # Shim-input decoder is the canonical export; a 4D-input decoder
            # is known-broken on real hardware (cache inputs silently zeroed).
            - name: WHISPER_SA_KV_SHIM
              value: "1"
            {{- else }}
            - name: WHISPER_DECODER
              value: "{{ .Values.modelCache.mountPath }}/whisper_decoder_{{ .Values.model }}.rknn"
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: model-cache
              mountPath: {{ .Values.modelCache.mountPath }}
            - name: audio-input
              mountPath: {{ .Values.audio.mountPath }}
              readOnly: true
            {{- if .Values.rknn.enabled }}
            {{- range .Values.rknn.devices }}
            - name: {{ . | base | replace "." "-" }}
              mountPath: {{ . }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-models
        - name: audio-input
          persistentVolumeClaim:
            claimName: {{ .Values.audio.claimName }}
        {{- if .Values.rknn.enabled }}
        {{- range .Values.rknn.devices }}
        - name: {{ . | base | replace "." "-" }}
          hostPath:
            path: {{ . }}
        {{- end }}
        {{- end }}
