image:
  repository: registry
  tag: "2"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5000
  hostPort: 5000   # exposes port 5000 on the host NIC; keeps the same address as the Phase A container

# Use a fixed LoadBalancer IP if you have MetalLB; else keep ClusterIP.
loadBalancer:
  enabled: false
  ip: ""   # set if enabled

persistence:
  enabled: true
  size: 50Gi
  storageClass: ""     # set if you have a SC; otherwise default

# TLS: provide your own cert+key (SAN MUST include the IP/hostname you use!)
tls:
  enabled: true
  secretName: registry-tls
  # You will create this secret from files: tls.crt, tls.key

auth:
  enabled: false   # TLS-first; enable after confirming TLS works (see ADR-0004)
  secretName: registry-htpasswd
  # Create from an htpasswd file (bcrypt). Example:
  # htpasswd -Bbn push S3cret! > htpasswd

registry:
  extraEnv: []   # e.g., ["REGISTRY_STORAGE_DELETE_ENABLED=true"]

# Pin registry to the server node so local-path PVC data follows the pod.
nodeSelector:
  kubernetes.io/hostname: rk1-node1

tolerations: []
affinity: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi
