# local-ssd StorageClass + provisioner — deployed by scripts/mount-ssd.sh
#
# A second instance of rancher/local-path-provisioner scoped to /mnt/ssd/ on
# nodes that have an NVMe SSD mounted. Node4 (no SSD) is excluded via the
# ConfigMap nodePathMap — the provisioner will refuse to create volumes there.
#
# The ConfigMap (local-ssd-config) is generated and applied separately by
# mount-ssd.sh because the nodePathMap must reflect which nodes actually have
# the SSD mounted.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-ssd-provisioner-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-ssd-provisioner-role
rules:
- apiGroups: [""]
  resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["endpoints", "persistentvolumes", "pods"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-ssd-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-ssd-provisioner-role
subjects:
- kind: ServiceAccount
  name: local-ssd-provisioner-sa
  namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-ssd-provisioner
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-ssd-provisioner
  template:
    metadata:
      labels:
        app: local-ssd-provisioner
    spec:
      serviceAccountName: local-ssd-provisioner-sa
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: local-ssd-provisioner
        image: rancher/local-path-provisioner:v0.0.35
        imagePullPolicy: IfNotPresent
        command:
        - local-path-provisioner
        - start
        - --config
        - /etc/config/config.json
        - --configmap-name
        - local-ssd-config
        - --provisioner-name
        - rancher.io/local-path-ssd
        - --service-account-name
        - local-ssd-provisioner-sa
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config/
      volumes:
      - name: config-volume
        configMap:
          name: local-ssd-config
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-ssd
provisioner: rancher.io/local-path-ssd
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
